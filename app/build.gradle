plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gnotesamsung7.voltnutttcg'
    compileSdk 34

    defaultConfig {
        applicationId "com.gnotesamsung7.voltnutttcg"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // A fixed key, so each new build installs over the last one
        // without uninstalling (and keeps your saved progress).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
